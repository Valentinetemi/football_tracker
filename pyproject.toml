[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-video-tracker"
version = "0.1.0"
description = "An understandable football video detection and tracking pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "supervision==0.25.1",
  "tqdm>=4.66,<5",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
ocr = [
  "easyocr>=1.7.2,<2",
  "opencv-python-headless>=4.10,<5",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
football-tracker = "football_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

